<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AULA 3</title>
</head>

<body>
    <h1>AULA 3 - IMAGENS, ÁUDIOS E VÍDEOS</h1>
    <hr>
    <h2>IMAGENS</h2>
    <section style="padding-top: 150px;">
        <center>
            <img src="img/imagem.jpg" alt="Mapa_viagem" width="430 px" height="440 px"
                style="border-radius: 100% ;cursor: cell; border:10px solid green ;">


            <img src="img/imagem_2.jpg" alt="Asa_avião_viagem" width="430 px" height="440 px" style="border-radius: 60px;cursor: grab; 
            border:10px solid rgb(47, 144, 255);margin-left: 5px">


            <img src="img/imagem_3.jpg" alt="Camboja_viagem" width="430 px" height="440 px" style="border-radius: 100%;cursor: move; 
            border:10px solid rgb(255, 78, 47);margin-left: 5px; ">
        </center>
    </section>
    <br>
    <br>
    <hr>
    <h2>ÁUDIOS</h2>
    <center>
        <section>
            <h3>Áudio 1</h3>
            <audio controls style="border: rgb(194, 187, 87) solid;">
                <source src="audio/audio1.mp3" type="audio/mp3">
            </audio>
        </section>
        <section>
            <h3>Áudio 2</h3>
            <audio controls style="border: rgb(45, 130, 209) solid;">
                <source src="audio/audio2.mp3" type="audio/mp3">
            </audio>
        </section>
    </center>
    <br>
    <br>
    <hr>
    <h2>VÍDEOS</h2>
    <center>
        <section>
            <h3>Vídeo 1</h3>
            <video controls width="500px" alt="Vista Panorâmica" style="border:5px cornflowerblue solid;">
                <source src="video/video1.mp4" type="video/mp4">
            </video>
        </section>
        <section>
            <h3>Vídeo 2</h3>
            <video controls width="500px" alt="Águas Vivas" style="border:5px coral solid;">
                <source src="video/video2.mp4" type="video/mp4">
            </video>
        </section>
    </center>
</body>

</html>
