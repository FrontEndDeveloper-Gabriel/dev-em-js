<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIVIDADE 4</title>
</head>

<body style="background-color: gray;">
    <h1 style="background-color: yellow; text-align: center;">SITE E-COMMERCE</h1>
    <br>
    <hr>
    <center>

        <h2 style="background-color: rgb(50, 131, 100); text-align: center; color: white; width: 300px;">Apresentação do
            Produto</h2>
        <section style="text-align: center;">
            <iframe width="700" height="500" src="https://www.youtube.com/embed/NRBLGxemtvY"
                title="iPhone 15 - Faz sentido?" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>
    </center>
    <br>
    <hr>
    <center>
        <h2 style="background-color: rgb(50, 131, 100); text-align: center; color: white; width: 300px;">Imagens do
            Produto
        </h2>
        <section style="padding-top: 150px;">
            <img src="img/produto1.jpg" alt="IPhone 15" width="430 px" height="440 px"
                style="border-radius: 100% ;cursor: cell; border:10px solid green ;">


            <img src="img/produto2.jpg" alt="Mais Detlahes do IPhone 15" width="430 px" height="440 px" style="border-radius: 60px;cursor: grab; 
            border:10px solid rgb(47, 144, 255);margin-left: 5px">


            <img src="img/produto3.jpg" alt="IPhone 15 e o IPhone 15 Max" width="430 px" height="440 px" style="border-radius: 100%;cursor: move; 
            border:10px solid rgb(255, 78, 47);margin-left: 5px; ">
    </center>
    </section>
    <br>
    <hr>
    <center>
        <h2 style="background-color: rgb(50, 131, 100); text-align: center; color: white; width: 300px;">Podcast Elon
            Musk
        </h2>
        <section>
            <audio controls>
                <source src="audio/podcast_musk.mp3" type="audio/mp3">
            </audio>
        </section>
    </center>
    <br>
    <hr>
    <center>
        <h2 style="background-color: rgb(50, 131, 100); text-align: center; color: white; width: 360px;">Tabela com
            Produtos
            Eletrônicos
        </h2>
        <section>
            <table border="6" style="border-top-style: coral; color: white; width: 900px; height: 400px;">
                <tr style="background-color: rgb(150, 64, 76);">
                    <th colspan="2">Nome do Produto</th>
                    <th colspan="2">Preço</th>
                    <th colspan="2">Quantidade</th>
                    <th colspan="2">Valor Total</th>
                </tr>
                <tr>
                    <td colspan="2" style="background-color: rgb(126, 68, 202); text-align: center;">Fone Bluetooth</td>
                    <td colspan="2" style="background-color: rgb(172, 170, 60); text-align: center;">R$ 78,99</td>
                    <td colspan="2" style="background-color: rgb(60, 127, 172); text-align: center;">1</td>
                    <td colspan="2" style="background-color: rgb(101, 172, 60); text-align: center;">R$ 78,99</td>
                </tr>
                <tr>
                    <td colspan="2" style="background-color: rgb(126, 68, 202); text-align: center;">Smartphone</td>
                    <td colspan="2" style="background-color: rgb(172, 170, 60); text-align: center;">R$ 1.500,00</td>
                    <td colspan="2" style="background-color: rgb(60, 127, 172); text-align: center;">1</td>
                    <td colspan="2" style="background-color: rgb(101, 172, 60); text-align: center;">R$ 1.500,00</td>
                </tr>
                <tr>
                    <td colspan="2" style="background-color: rgb(126, 68, 202); text-align: center;">Notebook</td>
                    <td colspan="2" style="background-color: rgb(172, 170, 60); text-align: center;">R$ 2.000,00</td>
                    <td colspan="2" style="background-color: rgb(60, 127, 172); text-align: center;">2</td>
                    <td colspan="2" style="background-color: rgb(101, 172, 60); text-align: center;">R$ 1.500,00</td>
                </tr>
            </table>
        </section>
    </center>
    <br>
    <hr>
    <center>
        <h2 style="background-color: rgb(50, 131, 100); text-align: center; color: white; width: 300px ">Formulário de
            Cadastro
        </h2>
        <section>
            <form
                style="border: 3px solid black; background-color: rgb(212, 194, 169); padding: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; width: 250px;">
                <label for="">Nome: </label>
                <input type="text" placeholder="Digite...">
                <br>
                <br>
                <label for="">Email: </label>
                <input type="email" placeholder="Digite...">
                <br>
                <br>
                <label for="">Senha: </label>
                <input type="password" placeholder="Digite...">
                <br>
                <br>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </center>
</body>

</html>
