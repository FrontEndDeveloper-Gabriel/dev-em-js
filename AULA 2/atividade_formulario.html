<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIVIDADE - FORMULÁRIO</title>
</head>

<body style="background-color: rgb(199, 188, 188);">
    <h1>FORMULÁRIO - CADASTRAMENTO DE PRODUTOS</h1>
    <form>
        <label for="">Nome do Produto: </label>
        <input type="text" placeholder="Digite...">
        <br>
        <br>
        <label for="">Preço: </label>
        <input type="number" placeholder="Digite...">
        <br>
        <br>
        <label for="">Quantidade: </label>
        <input type="number" placeholder="Digite...">
        <br>
        <br>
        <button type="submit">Enviar</button>
    </form>
    <br>
    <br>
    <br>
    <table border="6" style="border-top-style: coral; background-color: rgb(101, 101, 179); color: white;">
        <tr>
            <th colspan="2">Nome do Produto</th>
            <th colspan="2">Preço</th>
            <th colspan="2">Quantidade</th>
            <th colspan="2">Valor Total</th>
        </tr>
        <tr>
            <td colspan="2">Fone Bluetooth</td>
            <td colspan="2">R$ 78,99</td>
            <td colspan="2">1</td>
            <td colspan="2">R$ 78,99</td>
        </tr>
        <tr>
            <td colspan="2">Smartphone</td>
            <td colspan="2">R$ 1.500,00</td>
            <td colspan="2">1</td>
            <td colspan="2">R$ 1.500,00</td>
        </tr>
        <tr>
            <td colspan="2">Notebook</td>
            <td colspan="2">R$ 2.000,00</td>
            <td colspan="2">2</td>
            <td colspan="2">R$ 4.000,00</td>
        </tr>
    </table>
</body>

</html>
