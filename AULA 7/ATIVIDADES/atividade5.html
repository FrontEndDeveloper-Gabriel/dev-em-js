<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIPLO DE 8 E 16</title>
</head>

<body>
    <h1>MULTIPLO DE 8 E 16</h1>
</body>
<script>
    let numero = parseInt(prompt("Digite um número: "))
    let divisor1 = 8
    let divisor2 = 16
    if (numero % divisor1 === 0 && numero % divisor2 == 0) {
        console.log("É multiplo de 8 e 16 simultaneamente!");
    } else {
        console.log("Não é multiplo de 8 e 16 simultaneamente!");
    }
</script>

</html>
