<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERIFICADOR DE VOTAÇÃO</title>
</head>

<body>
    <h1>VERIFICADOR DE VOTAÇÃO</h1>
</body>
<script>
    console.log("Bem-vindo ao sistema de votação!")
    let idade = parseInt(prompt('Digite sua idade: '))
    if (idade >= 17) {
        console.log("Pode votar!");
    } else if (idade < 17) {
        console.log("Não pode votar!");
    } else {
        console.log("Error");
    }
</script>

</html>
