<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIVISÍVEL POR 9 E 6</title>
</head>

<body>
    <h1>DIVISÍVEL POR 9 E 6</h1>
</body>
<script>
    let numero = parseInt(prompt("Digite um número: "))
    let divisor1 = 6
    let divisor2 = 9
    if (numero % divisor1 === 0 || numero % divisor2 == 0) {
        console.log("É divisível por 6 ou 9!");
    } else {
        console.log("Não é divisível por 6 ou 9!");
    }
</script>

</html>
