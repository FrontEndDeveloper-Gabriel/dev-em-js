<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAR OU ÍMPAR</title>
</head>

<body>
    <h1>PAR OU ÍMPAR</h1>
</body>
<script>
    let numero = parseInt(prompt('Digite um número: '))
    if (numero % 2 == 0) {
        console.log("O número é Par!");
    } else if (numero % 2 == 1) {
        console.log("O número é Ímpar!");
    } else {
        console.log("Error");
    }
</script>

</html>
