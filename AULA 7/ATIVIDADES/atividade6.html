<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NÚMERO MAIOR E POSITIVO QUE 15</title>
</head>

<body>
    <h1>NÚMERO MAIOR E POSITIVO QUE 15</h1>
</body>
<script>
    let numero = parseInt(prompt('Digite um número: '))

    if (numero > 0 && numero > 15) {
        console.log("O número é positivo e é maior que 15!");
    } else if (numero > 0 && numero < 15) {
        console.log("O número é positivo, mas não é maior que 15!");
    } else {
        console.log("O número não é positivo, mas é maior que 15!");
    }
</script>

</html>
