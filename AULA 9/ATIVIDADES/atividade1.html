<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

</head>

<body>
    <h1>SAUDAÇÃO PERSONALIZADA</h1>
</body>
<script>
    function saudacaoPersonalizada(nome, horario) {
        if (horario === 'manhã') {
            console.log('Bom dia', nome)
        } else if (horario === 'tarde') {
            console.log('Boa tarde', nome)
        } else if (horario === 'noite') {
            console.log('Boa noite', nome)
        }
    }
    saudacaoPersonalizada('Pedro', 'noite')
    saudacaoPersonalizada('Caio', 'tarde')
</script>

</html>
