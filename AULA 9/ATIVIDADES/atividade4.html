    <h1>GERADOR DE TABUADA</h1>
</body>
<script>
    function gerarTabuada() {
        
        let numero1 = prompt("Digite um número: ")
        for (numero = 0; numero <= 10; numero++) {
            multiplicacao = numero1 * numero
            let result = multiplicacao
            console.log(numero1, 'X', numero, '=', result)
        }
    }
    gerarTabuada()
</script>
