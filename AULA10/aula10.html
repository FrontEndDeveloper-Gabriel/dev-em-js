    <h1>AULA 10 - POO</h1>
    <p>POO (Programação Orientada a Objetos) é um paradigma de programação baseado em objetos, que são estruturas que
        representam coisas do mundo real com propriedades (atributos) e ações (métodos).

        Com POO, o código fica mais organizado, reutilizável e fácil de manter.</p>
