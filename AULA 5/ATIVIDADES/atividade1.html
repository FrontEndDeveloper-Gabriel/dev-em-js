<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARDS COLORIDOS E RESPONSIVOS</title>
    <style>
        :root {
            --bg-color: #aeb4a9ff;
            --text-color: #fff;
            --card-color: rgb(66, 78, 85);
            --bt-color1: rgb(202, 90, 16);
            --bt-color2: rgb(38, 202, 16);
            --bt-color3: rgb(16, 159, 202);
            --bt-color4: rgb(202, 190, 16);
            --bt-color5: rgb(202, 16, 16);
            --bt-color6: rgb(103, 16, 202);
        }

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background: var(--card-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            gap: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250, 1fr));
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            background: var(--text-color);
        }

        .card {
            background: var(--bt-color1);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .card2 {
            background: var(--bt-color2);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .card3 {
            background: var(--bt-color3);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .card4 {
            background: var(--bt-color4);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .card5 {
            background: var(--bt-color5);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .card6 {
            background: var(--bt-color6);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        @media(max-width: 500px) {
            .container {
                grid-template-columns: 1fr;
                margin-top: 5px;
                padding: 8px;
            }

            .card {
                grid-template-columns: 1fr;
                padding: 5px;
            }

            p {
                font-size: 5px;
                grid-template-columns: 1fr;
            }

            h2 {
                font-size: 10px;
            }
        }
    </style>

</head>

<body>
    <h1>CARDS COLORIDOS E RESPONSIVOS</h1>
    <div class="container">
        <div class="card">
            <h2>CARD 1</h2>
            <p>Este é um card laranja!</p>
        </div>
    </div>
    <div class="container">
        <div class="card2">
            <h2>CARD 2</h2>
            <p>Este é um card verde!</p>
        </div>
    </div>
    <div class="container">
        <div class="card3">
            <h2>CARD 3</h2>
            <p>Este é um card azul!</p>
        </div>
    </div>
    <div class="container">
        <div class="card4">
            <h2>CARD 4</h2>
            <p>Este é um card amarelo!</p>
        </div>
    </div>
    <div class="container">
        <div class="card5">
            <h2>CARD 5</h2>
            <p>Este é um card vermelho!</p>
        </div>
    </div>
    <div class="container">
        <div class="card6">
            <h2>CARD 6</h2>
            <p>Este é um card roxo!</p>
        </div>
    </div>

</body>

</html>
