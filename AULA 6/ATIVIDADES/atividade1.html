<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELLO WORLD COM CONSOLE.LOG(), ALERT() E DOCUMENT.WRITE()</title>
</head>
<body>
    <h1>HELLO WORLD COM CONSOLE.LOG(), ALERT() E DOCUMENT.WRITE()</h1>
    <button onclick="console.log('Hello World!')">Click Here!</button>
    <br>
    <br>
    <hr>
    <button onclick="alert('Hello World!')">Click Here!</button>
    <br>
    <br>
    <hr>
    <button onclick="document.write('<h2> Another Hello World!</h2>')">Click Here!</button>
</body>
</html>
